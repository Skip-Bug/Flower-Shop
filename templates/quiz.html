{% extends "_base.html" %}

{% block content %}
	<section id="quiz">
		<div class="container">
			<div class="quiz">
				<div class="quiz__back ">
					<a href="{% url 'catalog:index' %}" class="quiz__back_link fic"><img src="{% static 'img/arrow-left.svg' %}" alt="arrow-left" class="arrowLeft">
					<span class="quiz__back_intro">Назад</span></a>
				</div>
				<div class="quiz__block">
					<h1 class="quiz__title">К какому событию нужен букет?</h1>
					<form method="post">
						{% csrf_token %}
						<div class="quiz__elems fic">
							{% for event in events %}
								<button type="submit" name="event" value="{{ event.slug }}" class="quiz__elem">
									{{ event.name }}
								</button>
							{% empty %}
								<p>События пока не добавлены</p>
							{% endfor %}
						</div>
					</form>
					<div class="quiz__progress">
						<div class="quiz__progress_step">
							<span class="quiz__progress_num">1</span>
							<span class="quiz__progress_in"> шаг из </span>
							<span class="quiz__progress_num">2</span>
						</div>
						<div class="quiz__progress_line">
							<div class="quiz__progress_lineStart"></div>
						</div>
					</div>
				</div>
				
			</div>
		</div>
	</section>
{% endblock %}

{% block footer %}{% endblock %}
