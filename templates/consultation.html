{% extends "_base.html" %}
{% load static %}

{% block content %}
	<section id="singUpConsultation">
		<div class="container">
			<div class="singUpConsultation">
				<form method="post" action="{% url 'orders:consultation_send' %}" class="singUpConsultation__form">
					{% csrf_token %}
					<div class="title">Запись на консультацию</div>
					{{ form.customer_name }}
					{{ form.phone }}
					{% if form.errors %}
					<div class="order__form_errors">
						{{ form.non_field_errors }}
						{% for field in form %}{{ field.errors }}{% endfor %}
					</div>
					{% endif %}
					<div class="chekbox fic">
						{{ form.consent }}
						<label for="{{ form.consent.id_for_label }}" class="chekbox__intro">Я согласен(а) с политикой конфиденциальности</label>
					</div>
					<button type="submit" class="btn singUpConsultation__form_btn">Отправить</button>
				</form>
				<div class="blockImgHiden"></div>
			</div>
		</div>
		<img src="{% static 'img/singUpConsultationImg.jpg' %}" alt="singUpConsultationImg" class="singUpConsultation__img">
	</section>
{% endblock %}
